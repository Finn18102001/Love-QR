<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Lá thư hồng • Trái tim rơi</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    }

    html {
      scroll-behavior: smooth;
    }

    /* Body: khi chưa mở thư thì căn giữa màn hình, khi mở thì scroll bình thường */
    body {
      background: linear-gradient(145deg, #1a0e1e 0%, #2c1a2e 100%);
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
    }

    /* ---------- TRÁI TIM RƠI (BACKGROUND) ---------- */
    .hearts-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .heart-fall {
      position: absolute;
      top: -10%;
      color: #ff3b5c;
      text-shadow: 0 0 12px #ff1e4a, 0 0 25px #ff8aa0;
      animation: fall linear infinite;
      user-select: none;
      will-change: transform;
      opacity: 0.9;
    }

    @keyframes fall {
      0% {
        transform: translateY(0) rotate(0deg) scale(1);
        opacity: 0.9;
      }
      100% {
        transform: translateY(115vh) rotate(360deg) scale(1.2);
        opacity: 0.3;
      }
    }

    /* ---------- KHU VỰC LÁ THƯ ---------- */
    /* Trạng thái ĐÓNG: wrapper chiếm toàn màn hình, căn giữa phong bì */
    .letter-wrapper {
      position: relative;
      z-index: 20;
      width: 100%;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
      perspective: 1200px;
    }

    /* Trạng thái MỞ: wrapper không còn ép chiều cao, chỉ hiển thị nội dung */
    .letter-wrapper.open {
      display: block;
      min-height: auto;
      padding: 24px 16px 40px;
    }

    /* Phong bì hồng */
    .envelope {
      background: linear-gradient(135deg, #ffb6c1 0%, #ff8da1 100%);
      border-radius: 24px 24px 18px 18px;
      padding: 40px 28px;
      cursor: pointer;
      box-shadow: 0 25px 40px rgba(0, 0, 0, 0.6), 0 0 0 2px #ffd9e2 inset, 0 0 30px #ff8aa0;
      transition: transform 0.4s cubic-bezier(0.2, 0.9, 0.3, 1.1), box-shadow 0.4s;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.4);
      width: 100%;
      max-width: 500px;
      transform-style: preserve-3d;
      transform: rotateX(0deg);
    }

    .envelope:hover {
      transform: scale(1.02) rotateX(2deg);
      box-shadow: 0 30px 55px rgba(255, 80, 120, 0.5), 0 0 0 3px #ffe2eb inset, 0 0 50px #ff4d6d;
    }

    .envelope:active {
      transform: scale(0.99);
    }

    .envelope .heart-icon {
      font-size: 5rem;
      line-height: 1;
      filter: drop-shadow(0 8px 12px #b3002d);
      margin-bottom: 12px;
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    .envelope h1 {
      font-size: 2.5rem;
      font-weight: 700;
      color: #fff0f5;
      text-shadow: 2px 2px 0 #c94f6d, 0 0 25px #ffb3c6;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .envelope p {
      font-size: 1.2rem;
      color: #fff3f8;
      text-shadow: 0 2px 5px #b3002d;
      background: rgba(255, 220, 230, 0.3);
      display: inline-block;
      padding: 8px 24px;
      border-radius: 60px;
      backdrop-filter: blur(4px);
      font-weight: 500;
      border: 1px solid #ffeef2;
    }

    /* Ẩn phong bì khi mở */
    .letter-wrapper.open .envelope {
      display: none;
    }

    /* ---------- BỨC THƯ ---------- */
    .letter-content {
      display: none;
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
      background: #fff8fa;
      background-image: radial-gradient(circle at 10% 20%, #fff0f5 0%, #ffe4ec 100%);
      border-radius: 28px;
      padding: 32px 24px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7), 0 0 0 2px #ffd0db inset, 0 0 50px #ff8aa0;
      border: 1px solid #ffb7c5;
      position: relative;
      animation: letterIn 0.6s cubic-bezier(0.23, 1, 0.32, 1);
    }

    @keyframes letterIn {
      0% {
        opacity: 0;
        transform: translateY(20px) scale(0.96);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .letter-wrapper.open .letter-content {
      display: block;
    }

    .letter-content::before {
      content: '';
      position: absolute;
      top: 12px;
      left: 20px;
      right: 20px;
      height: 4px;
      background: repeating-linear-gradient(90deg, #ffb6c1, #ffb6c1 10px, transparent 10px, transparent 20px);
      border-radius: 4px;
      opacity: 0.5;
    }

    .letter-inner {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .letter-text {
      color: #4a2c3a;
      font-size: 1.15rem;
      line-height: 1.7;
      text-align: center;
      font-style: italic;
      background: rgba(255, 240, 245, 0.6);
      padding: 16px 18px;
      border-radius: 40px 8px 40px 8px;
      border-left: 6px solid #ff8da1;
      border-right: 2px solid #ffb6c1;
      box-shadow: 0 4px 12px rgba(255, 150, 170, 0.3);
    }

    .letter-text i {
      color: #c93f5e;
      font-weight: 600;
      font-style: normal;
    }

    /* 1 ẢNH DUY NHẤT, TO */
    .photo-single {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 8px 0;
    }

    .photo-card {
      background: white;
      padding: 16px 16px 20px;
      border-radius: 24px 24px 28px 28px;
      box-shadow: 0 12px 22px rgba(200, 80, 110, 0.35), 0 0 0 1px #ffb7c5;
      transition: transform 0.3s ease, box-shadow 0.3s;
      max-width: 380px;
      width: 100%;
      transform: rotate(-1deg);
    }

    .photo-card:hover {
      transform: rotate(0deg) scale(1.02);
      box-shadow: 0 18px 30px rgba(255, 70, 110, 0.5), 0 0 0 2px #ff8da1;
    }

    .photo-card img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 16px;
      background: #ffeef2;
      border: 2px solid #ffd0db;
      aspect-ratio: 4/3;
      object-fit: cover;
    }

    .photo-caption {
      font-size: 1rem;
      color: #a14e64;
      text-align: center;
      margin-top: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    /* Nút đóng */
    .close-btn {
      align-self: center;
      background: #ffb6c1;
      border: none;
      border-radius: 50px;
      padding: 14px 40px;
      font-size: 1.1rem;
      font-weight: 600;
      color: #4d1e2b;
      margin-top: 8px;
      cursor: pointer;
      box-shadow: 0 6px 0 #b34b62, 0 8px 18px rgba(180, 50, 80, 0.4);
      transition: all 0.15s;
      border: 1px solid #ffeef2;
      letter-spacing: 1px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .close-btn:hover {
      background: #ff9eb0;
      transform: translateY(-2px);
      box-shadow: 0 8px 0 #b34b62, 0 12px 24px rgba(255, 80, 120, 0.5);
    }

    .close-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #b34b62, 0 8px 18px rgba(180, 50, 80, 0.4);
    }

    /* Mobile */
    @media (max-width: 540px) {
      .letter-wrapper {
        padding: 16px 12px;
      }
      .letter-wrapper.open {
        padding: 16px 12px 32px;
      }
      .envelope h1 { font-size: 1.9rem; }
      .envelope .heart-icon { font-size: 3.8rem; }
      .letter-content { padding: 22px 16px; border-radius: 22px; }
      .photo-card { max-width: 100%; padding: 12px 12px 16px; }
      .photo-card img { border-radius: 14px; }
      .letter-text { font-size: 1rem; }
      .close-btn { padding: 12px 28px; font-size: 1rem; }
    }
  </style>
</head>
<body>

  <!-- TRÁI TIM RƠI BACKGROUND -->
  <div class="hearts-bg" id="heartsBg"></div>

  <!-- LÁ THƯ + NỘI DUNG -->
  <div class="letter-wrapper" id="letterWrapper">
    <!-- PHONG BÌ HỒNG (CLICK ĐỂ MỞ) -->
    <div class="envelope" id="envelope">
      <div class="heart-icon">💌</div>
      <h1>Gửi em</h1>
      <p>❤️ Nhấn để mở thư ❤️</p>
    </div>

    <!-- BỨC THƯ ĐÃ MỞ -->
    <div class="letter-content" id="letterContent">
      <div class="letter-inner">
        <div class="letter-text">
          <i>“Có những điều muốn nói…</i><br>
          Gửi em chút yêu thương nhỏ bé,<br>
          mong em luôn vui và ấm áp. 🌸”
        </div>

        <!-- 1 ẢNH DUY NHẤT -->
        <div class="photo-single">
          <div class="photo-card">
            <img 
              src="https://picsum.photos/id/1015/800/600" 
              alt="Khoảnh khắc đẹp"
              loading="lazy"
            >
            <div class="photo-caption">✨ Kỷ niệm đáng nhớ ✨</div>
          </div>
        </div>

        <div class="letter-text" style="border-left-color: #ffb6c1; border-right-color: #ff8da1;">
          <i>“Và đây là lời cuối…”</i><br>
          Cảm ơn em vì đã ở đây,<br>
          chúc em một ngày thật dịu dàng. 💕
        </div>

        <button class="close-btn" id="closeBtn">
          <span>↺</span> Đóng thư
        </button>
      </div>
    </div>
  </div>

  <script>
    (function() {
      // ----- 1. TẠO TRÁI TIM RƠI -----
      const heartsContainer = document.getElementById('heartsBg');
      const heartCharacters = ['❤️', '💖', '💗', '💓', '💕', '❤️‍🔥', '🌸', '💘'];
      const HEART_COUNT = 45;

      for (let i = 0; i < HEART_COUNT; i++) {
        const heart = document.createElement('div');
        heart.classList.add('heart-fall');
        
        const randomChar = heartCharacters[Math.floor(Math.random() * heartCharacters.length)];
        heart.textContent = randomChar;

        heart.style.left = (Math.random() * 100) + '%';
        heart.style.fontSize = (0.8 + Math.random() * 1.8) + 'rem';
        heart.style.animationDuration = (6 + Math.random() * 14) + 's';
        heart.style.animationDelay = (Math.random() * 12) + 's';
        heart.style.transform = `rotate(${Math.random() * 360}deg)`;
        heart.style.opacity = 0.5 + Math.random() * 0.5;

        heartsContainer.appendChild(heart);
      }

      // ----- 2. MỞ / ĐÓNG THƯ -----
      const wrapper = document.getElementById('letterWrapper');
      const envelope = document.getElementById('envelope');
      const closeBtn = document.getElementById('closeBtn');

      function openLetter() {
        wrapper.classList.add('open');
        // Khi mở, kéo lên đầu thư
        window.scrollTo({ top: 0, behavior: 'auto' });
      }

      function closeLetter() {
        wrapper.classList.remove('open');
        window.scrollTo({ top: 0, behavior: 'auto' });
      }

      envelope.addEventListener('click', openLetter);

      closeBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        closeLetter();
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && wrapper.classList.contains('open')) {
          closeLetter();
        }
      });

      // Touch mobile
      envelope.addEventListener('touchstart', (e) => {
        e.preventDefault();
        openLetter();
      }, { passive: false });

      closeBtn.addEventListener('touchstart', (e) => {
        e.preventDefault();
        e.stopPropagation();
        closeLetter();
      }, { passive: false });

    })();
  </script>
</body>
</html>
