<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lá thư hồng • Trái tim rơi</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(145deg, #1a0e1e 0%, #2c1a2e 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      padding: 16px;
    }

    /* ---------- TRÁI TIM RƠI (BACKGROUND) ---------- */
    .hearts-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .heart-fall {
      position: absolute;
      top: -10%;
      color: #ff3b5c;
      text-shadow: 0 0 12px #ff1e4a, 0 0 25px #ff8aa0;
      animation: fall linear infinite;
      user-select: none;
      will-change: transform;
      opacity: 0.9;
    }

    @keyframes fall {
      0% {
        transform: translateY(0) rotate(0deg) scale(1);
        opacity: 0.9;
      }
      100% {
        transform: translateY(115vh) rotate(360deg) scale(1.2);
        opacity: 0.3;
      }
    }

    /* ---------- KHU VỰC LÁ THƯ CHÍNH ---------- */
    .letter-wrapper {
      position: relative;
      z-index: 20;
      width: 100%;
      max-width: 720px;
      perspective: 1200px;
    }

    /* Lá thư phong bì màu hồng (đóng) */
    .envelope {
      background: linear-gradient(135deg, #ffb6c1 0%, #ff8da1 100%);
      border-radius: 24px 24px 18px 18px;
      padding: 40px 28px;
      cursor: pointer;
      box-shadow: 0 25px 40px rgba(0, 0, 0, 0.6), 0 0 0 2px #ffd9e2 inset, 0 0 30px #ff8aa0;
      transition: transform 0.4s cubic-bezier(0.2, 0.9, 0.3, 1.1), box-shadow 0.4s, filter 0.3s;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.4);
      position: relative;
      transform-style: preserve-3d;
      transform: rotateX(0deg);
    }

    .envelope:hover {
      transform: scale(1.02) rotateX(2deg);
      box-shadow: 0 30px 55px rgba(255, 80, 120, 0.5), 0 0 0 3px #ffe2eb inset, 0 0 50px #ff4d6d;
    }

    .envelope:active {
      transform: scale(0.99);
    }

    /* Nội dung trên phong bì */
    .envelope .heart-icon {
      font-size: 5rem;
      line-height: 1;
      filter: drop-shadow(0 8px 12px #b3002d);
      margin-bottom: 12px;
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    .envelope h1 {
      font-size: 2.5rem;
      font-weight: 700;
      color: #fff0f5;
      text-shadow: 2px 2px 0 #c94f6d, 0 0 25px #ffb3c6;
      letter-spacing: 1px;
      margin-bottom: 8px;
      word-break: break-word;
    }

    .envelope p {
      font-size: 1.2rem;
      color: #fff3f8;
      text-shadow: 0 2px 5px #b3002d;
      background: rgba(255, 220, 230, 0.3);
      display: inline-block;
      padding: 8px 24px;
      border-radius: 60px;
      backdrop-filter: blur(4px);
      font-weight: 500;
      border: 1px solid #ffeef2;
    }

    /* ---------- BỨC THƯ MỞ (ẨN BAN ĐẦU) ---------- */
    .letter-content {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      background: #fff8fa;
      background-image: radial-gradient(circle at 10% 20%, #fff0f5 0%, #ffe4ec 100%);
      border-radius: 28px;
      padding: 32px 30px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7), 0 0 0 2px #ffd0db inset, 0 0 50px #ff8aa0;
      border: 1px solid #ffb7c5;
      transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
      opacity: 0;
      visibility: hidden;
      transform: translateY(20px) scale(0.96);
      pointer-events: none;
      max-height: 85vh;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: #ff8da1 #ffe2eb;
    }

    .letter-content::-webkit-scrollbar {
      width: 8px;
    }

    .letter-content::-webkit-scrollbar-track {
      background: #ffe2eb;
      border-radius: 10px;
    }

    .letter-content::-webkit-scrollbar-thumb {
      background: #ff8da1;
      border-radius: 10px;
    }

    /* Khi mở thư */
    .letter-wrapper.open .envelope {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: scale(0.9) rotateX(10deg);
    }

    .letter-wrapper.open .letter-content {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: translateY(0) scale(1);
      position: relative;
    }

    /* ---------- NỘI DUNG BỨC THƯ ---------- */
    .letter-inner {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .letter-text {
      color: #4a2c3a;
      font-size: 1.15rem;
      line-height: 1.7;
      text-align: center;
      font-style: italic;
      background: rgba(255, 240, 245, 0.6);
      padding: 16px 18px;
      border-radius: 40px 8px 40px 8px;
      border-left: 6px solid #ff8da1;
      border-right: 2px solid #ffb6c1;
      box-shadow: 0 4px 12px rgba(255, 150, 170, 0.3);
    }

    .letter-text i {
      color: #c93f5e;
      font-weight: 600;
      font-style: normal;
    }

    .photo-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 18px;
      margin: 8px 0;
    }

    .photo-card {
      background: white;
      padding: 12px 12px 16px 12px;
      border-radius: 20px 20px 24px 24px;
      box-shadow: 0 12px 22px rgba(200, 80, 110, 0.35), 0 0 0 1px #ffb7c5;
      transform: rotate(var(--rot, 0deg));
      transition: transform 0.3s ease, box-shadow 0.3s;
      max-width: 170px;
      flex: 0 1 auto;
    }

    .photo-card:hover {
      transform: rotate(0deg) scale(1.03);
      box-shadow: 0 18px 30px rgba(255, 70, 110, 0.5), 0 0 0 2px #ff8da1;
    }

    .photo-card img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 12px;
      background: #ffeef2;
      border: 2px solid #ffd0db;
      aspect-ratio: 1/1;
      object-fit: cover;
    }

    .photo-caption {
      font-size: 0.8rem;
      color: #a14e64;
      text-align: center;
      margin-top: 8px;
      font-weight: 500;
      letter-spacing: 0.5px;
    }

    /* Nút đóng thư */
    .close-btn {
      align-self: center;
      background: #ffb6c1;
      border: none;
      border-radius: 50px;
      padding: 12px 36px;
      font-size: 1.1rem;
      font-weight: 600;
      color: #4d1e2b;
      margin-top: 12px;
      cursor: pointer;
      box-shadow: 0 6px 0 #b34b62, 0 8px 18px rgba(180, 50, 80, 0.4);
      transition: all 0.15s;
      border: 1px solid #ffeef2;
      letter-spacing: 1px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .close-btn:hover {
      background: #ff9eb0;
      transform: translateY(-2px);
      box-shadow: 0 8px 0 #b34b62, 0 12px 24px rgba(255, 80, 120, 0.5);
    }

    .close-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #b34b62, 0 8px 18px rgba(180, 50, 80, 0.4);
    }

    /* Điều chỉnh ảnh trên mobile */
    @media (max-width: 540px) {
      .envelope h1 { font-size: 1.9rem; }
      .envelope .heart-icon { font-size: 3.8rem; }
      .letter-content { padding: 22px 16px; }
      .photo-card { max-width: 130px; }
      .letter-text { font-size: 1rem; }
    }

    /* Hiệu ứng lá thư giấy */
    .letter-content::before {
      content: '';
      position: absolute;
      top: 12px;
      left: 20px;
      right: 20px;
      height: 4px;
      background: repeating-linear-gradient(90deg, #ffb6c1, #ffb6c1 10px, transparent 10px, transparent 20px);
      border-radius: 4px;
      opacity: 0.5;
    }
  </style>
</head>
<body>

  <!-- TRÁI TIM RƠI BACKGROUND -->
  <div class="hearts-bg" id="heartsBg"></div>

  <!-- LÁ THƯ + NỘI DUNG -->
  <div class="letter-wrapper" id="letterWrapper">
    <!-- PHONG BÌ HỒNG (CLICK ĐỂ MỞ) -->
    <div class="envelope" id="envelope">
      <div class="heart-icon">💌</div>
      <h1>Gửi em</h1>
      <p>❤️ Nhấn để mở thư ❤️</p>
    </div>

    <!-- BỨC THƯ ĐÃ MỞ (ẨN) -->
    <div class="letter-content" id="letterContent">
      <div class="letter-inner">
        <!-- Lời nhắn phía trên ảnh -->
        <div class="letter-text">
          <i>“Có những điều muốn nói…</i><br>
          Gửi em chút yêu thương nhỏ bé,<br>
          mong em luôn vui và ấm áp. 🌸”
        </div>

        <!-- 3 BỨC ẢNH Ở GIỮA -->
        <div class="photo-grid">
          <!-- Ảnh 1 -->
          <div class="photo-card" style="--rot: -3deg;">
            <img 
              src="https://picsum.photos/id/1015/400/400" 
              alt="Khoảnh khắc 1"
              loading="lazy"
            >
            <div class="photo-caption">✨ Kỷ niệm 1</div>
          </div>
          <!-- Ảnh 2 -->
          <div class="photo-card" style="--rot: 2deg;">
            <img 
              src="https://picsum.photos/id/1043/400/400" 
              alt="Khoảnh khắc 2"
              loading="lazy"
            >
            <div class="photo-caption">🌸 Kỷ niệm 2</div>
          </div>
          <!-- Ảnh 3 -->
          <div class="photo-card" style="--rot: -1deg;">
            <img 
              src="https://picsum.photos/id/1069/400/400" 
              alt="Khoảnh khắc 3"
              loading="lazy"
            >
            <div class="photo-caption">💖 Kỷ niệm 3</div>
          </div>
        </div>

        <!-- Lời nhắn phía dưới ảnh -->
        <div class="letter-text" style="border-left-color: #ffb6c1; border-right-color: #ff8da1;">
          <i>“Và đây là lời cuối…”</i><br>
          Cảm ơn em vì đã ở đây,<br>
          chúc em một ngày thật dịu dàng. 💕
        </div>

        <!-- Nút đóng thư -->
        <button class="close-btn" id="closeBtn">
          <span>↺</span> Đóng thư
        </button>
      </div>
    </div>
  </div>

  <script>
    (function() {
      // ----- 1. TẠO TRÁI TIM RƠI -----
      const heartsContainer = document.getElementById('heartsBg');
      const heartCharacters = ['❤️', '💖', '💗', '💓', '💕', '❤️‍🔥', '🌸', '💘'];
      const HEART_COUNT = 45; // số lượng trái tim

      // Tạo các trái tim với vị trí, kích thước, thời gian rơi khác nhau
      for (let i = 0; i < HEART_COUNT; i++) {
        const heart = document.createElement('div');
        heart.classList.add('heart-fall');
        
        // Chọn biểu tượng ngẫu nhiên
        const randomChar = heartCharacters[Math.floor(Math.random() * heartCharacters.length)];
        heart.textContent = randomChar;

        // Vị trí ngang ngẫu nhiên (0% - 100%)
        const leftPos = Math.random() * 100;
        heart.style.left = leftPos + '%';

        // Kích thước ngẫu nhiên (0.8rem - 2.5rem)
        const size = 0.8 + Math.random() * 1.8;
        heart.style.fontSize = size + 'rem';

        // Thời gian rơi ngẫu nhiên (6s - 18s)
        const duration = 6 + Math.random() * 14;
        heart.style.animationDuration = duration + 's';

        // Độ trễ ngẫu nhiên (0s - 12s) để trái tim rơi không đồng loạt
        const delay = Math.random() * 12;
        heart.style.animationDelay = delay + 's';

        // Góc quay ban đầu ngẫu nhiên
        const rotateStart = Math.random() * 360;
        heart.style.transform = `rotate(${rotateStart}deg)`;

        // Thêm độ mờ khác nhau
        heart.style.opacity = 0.5 + Math.random() * 0.5;

        heartsContainer.appendChild(heart);
      }

      // ----- 2. XỬ LÝ MỞ / ĐÓNG THƯ -----
      const wrapper = document.getElementById('letterWrapper');
      const envelope = document.getElementById('envelope');
      const closeBtn = document.getElementById('closeBtn');
      const letterContent = document.getElementById('letterContent');

      // Hàm mở thư
      function openLetter() {
        wrapper.classList.add('open');
        // Cuộn lên đầu thư khi mở (nếu nội dung dài)
        if (letterContent) {
          letterContent.scrollTop = 0;
        }
      }

      // Hàm đóng thư
      function closeLetter() {
        wrapper.classList.remove('open');
      }

      // Click vào phong bì -> mở thư
      envelope.addEventListener('click', openLetter);

      // Click nút đóng -> đóng thư
      closeBtn.addEventListener('click', (e) => {
        e.stopPropagation(); // tránh sự kiện lan ra ngoài
        closeLetter();
      });

      // (Tùy chọn) Nhấn ESC để đóng thư
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && wrapper.classList.contains('open')) {
          closeLetter();
        }
      });

      // Ngăn chặn click vào nội dung thư bị đóng khi bấm ra ngoài (không cần thiết, giữ nguyên)
      // Nhưng thêm touch cho mobile mượt
      envelope.addEventListener('touchstart', (e) => {
        e.preventDefault(); // tránh double tap
        openLetter();
      }, { passive: false });

      // Đảm bảo nút đóng cũng nhận touch
      closeBtn.addEventListener('touchstart', (e) => {
        e.preventDefault();
        e.stopPropagation();
        closeLetter();
      }, { passive: false });

    })();
  </script>

  <!-- Chú thích: Ảnh sử dụng picsum.photos (ảnh ngẫu nhiên) -->
</body>
</html>
